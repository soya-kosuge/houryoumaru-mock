<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       .sidebar {
            width: 260px;
        }

       .content {
            margin-left: 260px;
        }

        @media(max-width:768px) {

            .sidebar {
                position: relative !important;
                width: 100%;
                height: auto !important;
            }

            .content {
                margin-left: 0;
                padding-top: 20px;
            }
        }        
    </style>
</head>
<body>
    <div class="bg-dark text-white p-3 sidebar position-fixed h-100">
        <h4>豊漁丸</h4>
        <div class="nav flex-column">
            <a class="nav-link text-white" href="adminDashboard.html">ダッシュボード</a>
            <a class="nav-link text-white" href="adminReservation.html">予約管理</a>
            <a class="nav-link text-white" href="adminTrip.html">出船管理</a>
            <a class="nav-link text-white" href="adminCustomerList.html">顧客管理</a>
            <a class="nav-link text-white" href="adminNotice.html">お知らせ</a>
            <a class="nav-link text-white" href="adminSettings.html">システム設定</a>
        </div>
    </div>
    <div class="content p-4">
        <h1>新規出船登録</h1>
        <div class="card p-4">
            <div class="mb-3">
                <label class="form-label">出船時刻</label>
                <input type="time" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">便名</label>
                <select class="form-select">
                    <option selected disabled>選択してください</option>
                    <option>半夜便</option>
                    <option>午前便</option>
                    <option>午後便</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">船名</label>
                <input type="text" class="form-control" placeholder="例：豊漁丸">
            </div>

            <div class="mb-3">
                <label class="form-label">船長名</label>
                <input type="text" class="form-control" placeholder="例：後藤船長">
            </div>

            <div class="mb-3">
                <label class="form-label">釣り物</label>
                <input type="text" class="form-control" placeholder="例：マイカ">
            </div>

            <div class="mb-3">
                <label class="form-label">集合時刻</label>
                <input type="time" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">集合場所</label>
                <input type="text" class="form-control" placeholder="例：豊漁丸乗船場">
            </div>

            <div class="mb-3">
                <label class="form-label">料金</label>
                <input type="number" class="form-control" placeholder="例：12000">
            </div>        <button id="registerBtn" class="btn btn-primary">
                登録
            </button>
            <a href="adminTrip.html" class="btn btn-secondary">
                戻る
            </a>
        </div>
    </div>
    <script>
        document.getElementById("registerBtn").addEventListener("click", function () {

            const result = confirm("この内容で登録しますか？");
            if (result) {

                alert("登録が完了しました");
                location.href = "adminTrip.html";

            }


        });
    </script>

</body>
</html>
