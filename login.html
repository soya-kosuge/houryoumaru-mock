<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豊漁丸｜ログイン</title>

    <link rel="stylesheet" href="shipSchedule.css">
    <link rel="stylesheet" href="reservationFlow.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand"
               href="shipSchedule.html"
               aria-label="豊漁丸の出船情報へ戻る">
                <img class="logo"
                     src="images/logo.png"
                     alt="豊漁丸 予約システム"
                     onerror="this.hidden = true">
            </a>
        </div>
    </header>

    <main class="flow-main">
        <div class="back-area">
            <a class="back-link"
               href="shipScheduleDetail_0728_Night_Fishing.html?id=20260725-hanya">
                <span aria-hidden="true">‹</span>
                出船詳細に戻る
            </a>
        </div>

        <section class="hero flow-hero">
            <span class="eyebrow">MEMBER LOGIN</span>
            <h1>ログイン</h1>
            <p class="lead">
                予約を続けるには、メールアドレスとパスワードを入力してください。
            </p>
        </section>

        <nav class="step-progress" aria-label="予約手続きの進行状況">

            <div class="step active" aria-current="step">
                <p class="step-number">STEP 1</p>
                <p class="step-title">ログイン</p>
                <span class="step-circle" aria-hidden="true"></span>
            </div>


            <div class="step-line" aria-hidden="true"></div>

            <div class="step">
                <p class="step-number">STEP 2</p>
                <p class="step-title">予約入力</p>
                <span class="step-circle" aria-hidden="true"></span>
            </div>


            <div class="step-line" aria-hidden="true"></div>

            <div class="step">
                <p class="step-number">STEP 3</p>
                <p class="step-title">内容確認</p>
                <span class="step-circle" aria-hidden="true"></span>
            </div>


            <div class="step-line" aria-hidden="true"></div>

            <div class="step">
                <p class="step-number">STEP 4</p>
                <p class="step-title">予約完了</p>
                <span class="step-circle" aria-hidden="true"></span>
            </div>

        </nav>

        <section class="flow-card login-card">
            <div class="flow-card-heading">
                <h2>ログイン情報</h2>
            </div>

            <form class="flow-form"
                  action="reservation.html"
                  method="get">
                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input id="email"
                           name="email"
                           type="email"
                           autocomplete="email"
                           placeholder="example@example.com"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input id="password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           minlength="8"
                           placeholder="8文字以上の半角英数字記号"
                           required>
                    <p class="form-note">
                        パスワードは8文字以上で入力してください。
                    </p>
                </div>

                <button class="primary-button" type="submit">
                    ログインして予約へ進む
                </button>
            </form>

            <div class="sub-actions">
                <a class="text-link" href="#">パスワードを忘れた方</a>
                <a class="text-link" href="#">新規会員登録はこちら</a>
            </div>

            <div class="line-login">
                <p>LINE連携済みの方</p>
                <a class="line-button" href="reservation.html">
                    LINEでログイン
                </a>
            </div>
        </section>

        <aside class="notice">
            ログイン後、選択した便の予約入力画面へ進みます。
        </aside>
    </main>

    <footer>
        © 2026 豊漁丸 予約システム
    </footer>
</body>
</html>
