<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約内容変更 | 豊漁丸</title>
  <link rel="stylesheet" href="./css/common.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="../user/shipScheduleList.html" aria-label="豊漁丸の出船情報へ戻る">
      <img class="logo" src="./images/豊漁丸_ユーザー画面_ロゴ.png" alt="豊漁丸 予約システム">
    </a>
  </div>
</header>
<main>
  <div id="saveNotice"></div>
  <div class="change-limit-notice" id="changeLimitNotice">出船48時間前まではWeb上から人数・レンタル品を変更できます。出船日・便を変更する場合は、予約をキャンセルして再予約してください。</div>

  <form id="reservationEditForm">
    <section class="section">
      <div class="section-head"><div><p class="eyebrow">RESERVATION</p><h2>予約内容</h2></div></div>
      <div class="card">
        <div class="form-grid">
          <div class="field"><label>出船日</label><div class="readonly-value" id="reservationDateText"></div></div>
          <div class="field"><label>便</label><div class="readonly-value" id="tripTypeText"></div></div>
          <div class="field"><label>出船時刻</label><div class="readonly-value" id="departureTimeText"></div></div>
          <div class="field"><label for="partySize">人数</label><input id="partySize" type="number" min="1" max="25" required></div>
          <div class="field"><label for="rentalRods">貸し竿</label><input id="rentalRods" type="number" min="0" max="25" required></div>
        </div>
        <div class="price-summary" aria-live="polite">
          <div class="price-row"><span>乗船料金</span><strong id="farePrice"></strong></div>
          <div class="price-row"><span>貸し竿料金</span><strong id="rentalPrice"></strong></div>
          <div class="price-row price-total"><span>合計</span><strong id="totalPrice"></strong></div>
          <div class="helper" id="rentalPriceNote"></div>
        </div>
      </div>
    </section>

    <div class="form-actions">
      <a class="btn" id="backDetailLink" href="./reservation-detail.html">変更せず戻る</a>
      <button class="btn primary" id="saveReservationButton" type="submit">変更内容を保存</button>
    </div>
  </form>
</main>
<footer>© 2026 豊漁丸 予約システム</footer>
<script src="./js/data.js"></script>
<script src="./js/reservation-edit.js"></script>
</body>
</html>
