<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録情報の編集 | 豊漁丸</title>
  <link rel="stylesheet" href="./css/common.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="../user/shipScheduleList.html" aria-label="豊漁丸の出船情報へ戻る">
      <img class="logo" src="./images/豊漁丸_ユーザー画面_ロゴ.png" alt="豊漁丸 予約システム">
    </a>
  </div>
</header>
<main>
  <form id="profileEditForm">
    <section class="section">
      <div class="section-head"><div><p class="eyebrow">ACCOUNT</p><h2>予約システム ログイン情報</h2></div></div>
      <div class="card"><div class="form-grid">
        <div class="field"><label for="nameKanji">氏名（漢字）</label><input id="nameKanji" type="text" required></div>
        <div class="field"><label for="nameKana">氏名（かな）</label><input id="nameKana" type="text" required></div>
        <div class="field full"><label for="email">メールアドレス</label><input id="email" type="email" required></div>
        <div class="field full"><label for="phone">電話番号</label><input id="phone" type="tel" inputmode="numeric" required><div class="helper">数字を入力するとハイフンを自動で付けます。</div></div>
      </div></div>
    </section>

    <section class="section" id="roster-fields">
      <div class="section-head"><div><p class="eyebrow">PASSENGER INFORMATION</p><h2>乗船名簿情報</h2></div></div>
      <div class="card"><div class="form-grid">
        <div class="field"><label for="rosterName">氏名</label><input id="rosterName" type="text" placeholder="例：山田 太郎"></div>
        <div class="field"><label for="postalCode">郵便番号</label><input id="postalCode" type="text" inputmode="numeric" maxlength="8" placeholder="例：460-0000"><div class="helper" id="postalHelper">郵便番号から住所を自動入力できます。</div></div>
        <div class="field full"><label for="address">住所</label><input id="address" type="text" placeholder="例：愛知県名古屋市中区"></div>
        <div class="field full"><label for="addressDetail">番地・建物名</label><input id="addressDetail" type="text" placeholder="例：○○町1-2-3 ○○マンション101号室"></div>
        <div class="field"><label for="age">年齢</label><input id="age" type="number" min="0" max="120" placeholder="例：32"></div>
        <div class="field"><label for="gender">性別</label><select id="gender"><option value="">選択してください</option><option value="男性">男性</option><option value="女性">女性</option><option value="回答しない">回答しない</option></select></div>
        <div class="field"><label for="emergency">緊急連絡先（電話番号）</label><input id="emergency" type="tel" inputmode="numeric" placeholder="例：090-1234-5678"><div class="helper">乗船名簿は未入力でも保存できます。</div></div>
        <div class="field"><label for="emergencyRelation">続柄</label><select id="emergencyRelation"><option value="">選択してください</option><option value="妻">妻</option><option value="夫">夫</option><option value="父">父</option><option value="母">母</option><option value="息子">息子</option><option value="娘">娘</option><option value="兄">兄</option><option value="姉">姉</option><option value="弟">弟</option><option value="妹">妹</option><option value="その他">その他</option></select></div>
      </div></div>
    </section>

    <div class="form-actions">
      <a class="btn" href="./index.html">変更せず戻る</a>
      <button class="btn primary" type="submit">登録情報を保存</button>
    </div>
  </form>
</main>
<footer>© 2026 豊漁丸 予約システム</footer>
<script src="./js/data.js"></script>
<script src="./js/profile-edit.js"></script>
</body>
</html>
