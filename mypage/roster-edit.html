<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乗船名簿情報の変更 | 豊漁丸</title>
  <link rel="stylesheet" href="./css/common.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="./index.html" aria-label="豊漁丸 マイページへ">
      <img class="logo" src="./images/豊漁丸_ユーザー画面_ロゴ.png" alt="豊漁丸 予約システム">
    </a>
  </div>
</header>
<main>
  <form id="rosterEditForm">
    <section class="section">
      <div class="section-head">
        <div><p class="eyebrow">PASSENGER INFORMATION</p><h2>乗船名簿情報の変更</h2></div>
      </div>
      <div class="card">
        <div class="form-grid">
          <div class="field"><label for="rosterName">氏名</label><input id="rosterName" type="text" placeholder="例：山田 太郎" required></div>
          <div class="field"><label for="postalCode">郵便番号</label><input id="postalCode" type="text" inputmode="numeric" maxlength="8" placeholder="例：460-0000" required><div class="helper" id="postalHelper">郵便番号を入力すると住所を自動入力します。</div></div>
          <div class="field full"><label for="address">住所</label><input id="address" type="text" placeholder="例：愛知県名古屋市○○区1-2-3" required></div>
          <div class="field"><label for="age">年齢</label><input id="age" type="number" min="0" max="120" placeholder="例：32" required></div>
          <div class="field"><label for="gender">性別</label>
            <select id="gender" required>
              <option value="" selected disabled>選択してください</option>
              <option value="男性">男性</option>
              <option value="女性">女性</option>
              <option value="回答しない">回答しない</option>
            </select>
          </div>
          <div class="field full">
            <label for="emergency">緊急連絡先</label>
            <input id="emergency" class="phone-input" type="tel" inputmode="numeric" placeholder="例：090-1234-5678" required>
            <div class="helper">数字を入力するとハイフンを自動で付けます。</div>
          </div>
        </div>
      </div>
    </section>
    <div class="form-actions">
      <a class="btn" href="./index.html">変更せず戻る</a>
      <button class="btn primary" type="submit">乗船名簿情報を保存</button>
    </div>
  </form>
</main>
<footer>© 2026 豊漁丸 予約システム</footer>
<script src="./js/data.js"></script>
<script src="./js/roster-edit.js"></script>
</body>
</html>
