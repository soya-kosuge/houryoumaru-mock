<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>豊漁丸｜ログイン</title><link rel="stylesheet" href="css/shipScheduleList.css"><link rel="stylesheet" href="css/reservationFlow.css"><script src="js/reservationFlow.js" defer></script></head><body>
<header class="site-header"><div class="header-inner"><a class="brand" href="shipScheduleList.html"><img class="logo" src="images/豊漁丸_ユーザーページ_ロゴ.png" alt="豊漁丸 予約システム" onerror="this.hidden=true"></a></div></header>
<main class="flow-main"><section class="hero flow-hero"><span class="eyebrow">LINE MEMBER</span><h1 id="login-title">初回登録</h1><p class="lead" id="login-lead">初回のみ基本情報を登録してください。次回からはLINEログインだけで進めます。</p></section>
<section class="flow-card login-card"><div id="first-login-area"><div class="flow-card-heading"><h2>初回登録情報</h2></div><form class="flow-form" id="first-login-form"><div class="form-group"><label for="name">名前 <span class="required">必須</span></label><input id="name" name="name" type="text" autocomplete="name" required></div><div class="form-group"><label for="email">メールアドレス <span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">パスワード <span class="required">必須</span></label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><button class="primary-button" type="submit">登録して出船予定へ</button></form></div>
<div id="line-login-area" hidden><div class="flow-card-heading"><h2>LINEログイン</h2></div><p class="lead">登録済みのため、LINEログインだけで出船予定を表示します。</p><button class="line-button" id="line-login-button" type="button">LINEでログイン</button><p id="loading-message" hidden>ログイン中です…</p></div></section></main><footer>© 2026 豊漁丸 予約システム</footer><script>
// HTML単体でも出船予定一覧へ遷移できるフォールバック
const firstLoginForm = document.getElementById('first-login-form');
if (firstLoginForm) {
  firstLoginForm.addEventListener('submit', (event) => {
    event.preventDefault();
    location.href = 'shipScheduleList.html';
  });
}
const lineLoginButton = document.getElementById('line-login-button');
if (lineLoginButton) {
  lineLoginButton.addEventListener('click', () => {
    location.href = 'shipScheduleList.html';
  });
}
</script></body></html>
