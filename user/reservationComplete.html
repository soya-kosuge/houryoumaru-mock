<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豊漁丸｜予約完了</title>
    <link rel="stylesheet" href="css/shipScheduleList.css">
    <link rel="stylesheet" href="css/reservationFlow.css">
</head>
<body>
    <script>
        if (sessionStorage.getItem('horyomaruMockSessionLoggedIn') !== 'true') {
            location.replace('signin.html');
        }
    </script>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="shipScheduleList.html">
                <img
                    class="logo"
                    src="images/豊漁丸_ユーザー画面_ロゴ.png"
                    alt="豊漁丸 予約システム"
                    onerror="this.hidden = true"
                >
            </a>
        </div>
    </header>

    <main class="flow-main">
        <section class="hero flow-hero">
            <span class="eyebrow">RESERVATION COMPLETE</span>
            <h1>予約完了</h1>
        </section>

        <section class="flow-card completion-card">
            <h2 class="completion-title">ご予約ありがとうございました。</h2>

            <div class="completion-notice">
                <p class="completion-notice-text">
                    予約内容はLINE・メールへ送信される想定です。現在は画面確認用の仮実装です。
                </p>
            </div>

            <div class="completion-action">
                <a class="primary-button completion-button" href="shipScheduleList.html">
                    出船予定へ戻る
                </a>
            </div>
        </section>
    </main>

    <footer>© 2026 豊漁丸 予約システム</footer>
</body>
</html>
