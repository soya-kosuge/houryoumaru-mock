<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>豊漁丸｜予約内容確認</title>

    <link rel="stylesheet" href="css/shipScheduleList.css">
    <link rel="stylesheet" href="css/reservationFlow.css">

    <script src="js/scheduleApi.js" defer></script>
    <script src="js/reservationFlow.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="../shared/appData.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="shipScheduleList.html">
                <img class="logo"
                     src="images/豊漁丸_ユーザー画面_ロゴ.png"
                     alt="豊漁丸 予約システム">
            </a>
        </div>
    </header>

    <main class="flow-main">
        <section class="hero flow-hero">
            <span class="eyebrow">
                RESERVATION CONFIRMATION
            </span>

            <h1>
                予約内容確認
            </h1>

            <p class="lead">
                選択した便と予約内容を確認してください。
            </p>
        </section>

        <p class="confirmation-guidance">
            ※予約はまだ完了しておりません。入力内容に問題がなければ「この内容で予約する」ボタンを押してください。
        </p>

        <div class="reservation-error-box" id="reservation-error" role="alert" hidden></div>

        <div class="confirmation-card-list">
            <section class="selected-trip confirmation-trip-card" aria-labelledby="confirmation-trip-title">
                <div>
                    <p class="selected-trip-label">選択中の便</p>
                    <h2 id="confirmation-trip-title">選択した便</h2>
                </div>

                <dl>
                    <div>
                        <dt>出船時刻</dt>
                        <dd id="confirmation-trip-time">－</dd>
                    </div>
                    <div>
                        <dt>釣り物</dt>
                        <dd id="confirmation-trip-target">－</dd>
                    </div>
                    <div>
                        <dt>料金</dt>
                        <dd id="confirmation-trip-price">－</dd>
                    </div>
                </dl>
            </section>

            <section class="flow-card confirmation-detail-card">
                <div class="flow-card-heading">
                    <h2>予約内容</h2>
                </div>
                <dl class="confirmation-list" id="confirmation-list"></dl>
            </section>

            <section class="flow-card confirmation-total-card" aria-labelledby="confirmation-total-label">
                <span class="confirmation-total-label" id="confirmation-total-label">合計金額</span>
                <span class="confirmation-total-value" id="confirmation-total">0円（税込）</span>
            </section>
        </div>

        <div class="confirmation-actions confirmation-page-actions">
            <a class="secondary-button" href="reservation.html">入力内容を修正する</a>
            <a class="primary-button confirm-button" id="complete-link" href="reservationComplete.html">この内容で予約する</a>
        </div>
    </main>

    <footer>
        © 2026 豊漁丸 予約システム
    </footer>
</body>
</html>
