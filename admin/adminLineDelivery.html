<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      LINE配信｜豊漁丸 管理画面
    </title>
    <link href="css/admin.css" rel="stylesheet"/>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="adminDashboard.html">
          <img alt="豊漁丸" class="brand-logo" src="images/豊漁丸_管理者画面_ロゴ.png"/>
        </a>
        <nav class="header-nav">
          <a href="adminDashboard.html">
            ダッシュボード
          </a>
          <a href="adminReservation.html">
            予約管理
          </a>
          <a href="adminTrip.html">
            出船管理
          </a>
          <a href="adminCustomer.html">
            顧客管理
          </a>
          <a class="is-active" href="adminLineDelivery.html">
            LINE配信
          </a>
        </nav>
        <button aria-label="メニューを開く" class="menu-toggle" type="button">
          メニュー
        </button>
      </div>
    </header>
    <section class="hero">
      <div class="hero-inner">
        <p class="eyebrow">
          HORYOMARU ADMIN
        </p>
        <h1>
          LINE配信
        </h1>
        <p>
          利用者向けのLINEメッセージを作成・配信します。
        </p>
      </div>
    </section>
    <main class="page">
      <section class="grid grid-2">
        <article class="card">
          <div class="card-body">
            <h2 class="section-title">
              LINEメッセージ作成
            </h2>
            <form data-demo-submit="LINEメッセージを配信しました">
              <div class="field">
                <label for="line-title">
                  件名
                </label>
                <input class="input" id="line-title" placeholder="例：出船時間変更のお知らせ" required=""/>
              </div>
              <div class="field mt-16">
                <label for="line-body">
                  本文
                </label>
                <textarea class="textarea" id="line-body" placeholder="LINEで送信する内容を入力してください" required=""></textarea>
              </div>
              <div class="form-actions">
                <button class="btn btn-primary" type="submit">
                  LINE配信する
                </button>
                <button class="btn btn-secondary" type="button">
                  プレビュー
                </button>
              </div>
            </form>
          </div>
        </article>
        <article class="card">
          <div class="card-body">
            <h2 class="section-title">
              配信履歴
            </h2>
            <div class="kpi-list">
              <div class="kpi-row">
                <span>
                  夏季の集合時間について
                </span>
                <span class="badge badge-green">
                  送信済み
                </span>
              </div>
              <div class="kpi-row">
                <span>
                  駐車場利用のお願い
                </span>
                <span class="badge badge-green">
                  送信済み
                </span>
              </div>
              <div class="kpi-row">
                <span>
                  メンテナンス予定
                </span>
                <span class="badge badge-orange">
                  下書き
                </span>
              </div>
            </div>
          </div>
        </article>
      </section>
    </main>
    <footer class="footer">
      © 豊漁丸 管理画面 MOCK
    </footer>
    <script src="../shared/appData.js"></script>
    <script src="js/sharedDataBinder.js"></script>
    <script src="js/adminMockData.js"></script>
    <script src="js/admin.js">
    </script>
  </body>
</html>
