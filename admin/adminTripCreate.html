
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      新規出船登録｜豊漁丸 管理画面
    </title>
    <link href="css/admin.css" rel="stylesheet"/>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="adminDashboard.html">
          <img alt="豊漁丸" class="brand-logo" src="images/豊漁丸_管理者画面_ロゴ.png"/>
        </a>
        <nav class="header-nav">
          <a href="adminDashboard.html">
            ダッシュボード
          </a>
          <a href="adminReservation.html">
            予約管理
          </a>
          <a class="is-active" href="adminTrip.html">
            出船管理
          </a>
          <a href="adminCustomer.html">
            顧客管理
          </a>
          <a href="adminLineDelivery.html">
            LINE配信
          </a>
        </nav>
        <button aria-label="メニューを開く" class="menu-toggle" type="button">
          メニュー
        </button>
      </div>
    </header>
    <section class="hero trip-add-hero">
      <div class="hero-inner">
        <p class="eyebrow">
          HORYOMARU ADMIN
        </p>
        <div class="trip-add-hero-row">
          <div>
            <h1>
              新規出船登録
            </h1>
            <p>
              新しい出船予定を登録します。運航に必要な情報を入力してください。
            </p>
          </div>
        </div>
      </div>
    </section>
    <main class="page trip-add-page">
      <form class="trip-add-form" data-demo-submit="出船予定を登録しました" data-redirect="adminTrip.html">
        <section class="trip-form-section">
          <div class="trip-form-body form-grid trip-setting-grid">
            <div class="field">
              <label for="trip-date">
                出船日付
                <span class="required-label">
                  必須
                </span>
              </label>
              <input class="input" id="trip-date" required="" type="date"/>
            </div>
            <div class="field">
              <label for="trip-name">
                便名
                <span class="required-label">
                  必須
                </span>
              </label>
              <select class="select" id="trip-name" required="">
                <option value="">
                  選択してください
                </option>
                <option>
                  半夜便
                </option>
                <option>
                  深夜便
                </option>
                <option>
                  アオリ便
                </option>
                <option>
                  早朝便
                </option>
              </select>
            </div>
            <div class="field">
              <label for="ship-name">
                船名
              </label>
              <select class="select" id="ship-name">
                <option value="カムトゥドリーム">カムトゥドリーム</option>
                <option value="ドリーム">ドリーム</option>
                <option value="スーパードリーム">スーパードリーム</option>
              </select>
            </div>
            <div class="field">
              <label for="captain-name">
                船長名
              </label>
              <select class="select" id="captain-name">
                <option value="佐藤船長">佐藤船長</option>
                <option value="山田船長">山田船長</option>
              </select>
            </div>
            <div class="field">
              <label for="meeting-time">
                集合時刻
              </label>
              <input class="input" id="meeting-time" type="time"/>
            </div>
            <div class="field">
              <label for="trip-time">
                出船時刻
                <span class="required-label">
                  必須
                </span>
              </label>
              <input class="input" id="trip-time" required="" type="time"/>
            </div>
            <div class="field full">
              <label for="meeting-place">
                集合場所
              </label>
              <input class="input" id="meeting-place" placeholder="例：豊漁丸乗船場"/>
            </div>
            <div class="field full">
              <label for="fishing-target">
                釣り物
              </label>
              <input class="input" id="fishing-target" list="fishing-target-history" placeholder="例：マイカ"/>
              <datalist id="fishing-target-history"></datalist>
            </div>
            <div class="field">
              <label for="capacity">
                定員
              </label>
              <div class="input-with-unit">
                <input class="input" id="capacity" min="1" type="number" value="12"/>
                <span>
                  名
                </span>
              </div>
            </div>
            <div class="field">
              <label for="special-capacity">特別枠</label>
              <div class="input-with-unit">
                <input class="input" id="special-capacity" min="0" type="number" value="0"/>
                <span>名</span>
              </div>
            </div>
            <div class="field">
              <label for="price">
                料金
              </label>
              <div class="input-with-unit">
                <input class="input" id="price" min="0" placeholder="12000" type="number"/>
                <span>
                  円
                </span>
              </div>
            </div>
            <div class="field full">
              <label for="trip-status">
                受付状態
              </label>
              <div class="trip-auto-status">〇 空きあり</div>
              <p class="field-help">
                状態は予約数と定員から自動で決まります。
              </p>
            </div>
          </div>
        </section>
        <div class="trip-form-footer">
          <div class="trip-form-footer-note">
            入力内容を確認してから登録してください。
          </div>
          <div class="trip-form-actions">
            <a class="btn btn-secondary" href="adminTrip.html">
              キャンセル
            </a>
            <button class="btn btn-primary trip-submit-btn" type="submit">
              出船予定を登録する
            </button>
          </div>
        </div>
      </form>
    </main>
    <footer class="footer">
      © 豊漁丸 管理画面 MOCK
    </footer>
    <script src="../shared/appData.js"></script>
    <script src="js/sharedDataBinder.js"></script>
    <script src="js/adminMockData.js"></script>
    <script src="js/admin.js">
    </script>
  </body>
</html>
