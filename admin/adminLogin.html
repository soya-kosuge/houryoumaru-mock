<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者ログイン｜豊漁丸 管理画面</title>
    <link href="css/admin.css" rel="stylesheet">
  </head>
  <body class="admin-login-page">
    <header class="site-header admin-login-header">
      <div class="header-inner admin-login-header-inner">
        <a class="brand" href="adminLogin.html" aria-label="豊漁丸 管理者ログイン">
          <img alt="豊漁丸" class="brand-logo" src="images/豊漁丸_管理者画面_ロゴ.png">
        </a>
      </div>
    </header>

    <main class="admin-login-main">
      <section class="admin-login-card" aria-labelledby="admin-login-title">
        <div class="admin-login-heading">
          <p class="admin-login-eyebrow">HORYOMARU ADMIN</p>
          <h1 id="admin-login-title">管理者ログイン</h1>
          <p>管理者IDとパスワードを入力してください。</p>
        </div>

        <form class="admin-login-form" onsubmit="event.preventDefault(); location.href='adminDashboard.html';">
          <div class="field">
            <label for="admin-id">管理者ID</label>
            <input class="input" id="admin-id" name="adminId" type="text" autocomplete="username" placeholder="管理者IDを入力">
          </div>

          <div class="field">
            <label for="admin-password">パスワード</label>
            <input class="input" id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="パスワードを入力">
            <button class="admin-forgot-password-link" type="button">パスワードを忘れた方はこちら</button>
          </div>

          <button class="btn btn-primary admin-login-button" type="submit">ログイン</button>
        </form>
      </section>
    </main>

    <footer class="footer admin-login-footer">© 2026 豊漁丸</footer>
  </body>
</html>
