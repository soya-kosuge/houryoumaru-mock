<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>
        予約管理｜豊漁丸 管理画面
    </title>
    <link href="css/admin.css" rel="stylesheet" />
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="adminDashboard.html">
                <img alt="豊漁丸" class="brand-logo" src="images/豊漁丸_管理者画面_ロゴ.png" />
            </a>
            <nav class="header-nav">
                <a href="adminDashboard.html">
                    ダッシュボード
                </a>
                <a class="is-active" href="adminReservation.html">
                    予約管理
                </a>
                <a href="adminTrip.html">
                    出船管理
                </a>
                <a href="adminCustomer.html">
                    顧客管理
                </a>
                <a href="adminLineDelivery.html">
                    LINE配信
                </a>
            </nav>
            <button aria-label="メニューを開く" class="menu-toggle" type="button">
                メニュー
            </button>
        </div>
    </header>
    <section class="hero">
        <div class="hero-inner">
            <p class="eyebrow">
                HORYOMARU ADMIN
            </p>
            <h1>
                予約管理
            </h1>
            <p>
                予約状況を検索し、詳細確認や修正へ進めます。
            </p>
        </div>
    </section>
    <main class="page">
        <div class="page-actions">
            <h2 class="section-title">
                予約一覧
            </h2>
            <div class="actions">
                <a class="btn btn-primary" href="adminPhoneReservation.html">
                    電話予約を登録
                </a>
                <a class="btn btn-secondary" href="adminReservationDetail.html" id="reservation-detail-link">
                    予約詳細を開く
                </a>
                <a class="btn btn-secondary" href="adminReservationDetailPrint.html" id="reservation-print-link">
                    印刷
                </a>
            </div>
        </div>
        <div class="toolbar">
            <div class="field">
                <label for="reservation-date">
                    予約日
                </label>
                <input class="input" id="reservation-date" type="date" />
            </div>
            <div class="field">
                <label for="reservation-course">
                    便
                </label>
                <select class="input" id="reservation-course">
                    <option value="">
                        すべて
                    </option>
                    <option value="半夜便">
                        半夜便
                    </option>
                    <option value="深夜便">
                        深夜便
                    </option>
                    <option value="深夜便（中型船）">
                        深夜便（中型船）
                    </option>
                </select>
            </div>
            <div class="field">
                <label for="reservation-ship">
                    船名
                </label>
                <select class="select" id="reservation-ship">
                    <option value="">すべて</option>
                    <option value="豊漁丸">豊漁丸</option>
                    <option value="第二豊漁丸">第二豊漁丸</option>
                </select>
            </div>
            <div class="field">
                <label for="reservation-guests">
                    人数
                </label>
                <input class="input" id="reservation-guests" min="1" placeholder="人数" type="number" />
            </div>
            <div class="field">
                <label for="reservation-sort-direction">
                    順序
                </label>
                <select class="select" id="reservation-sort-direction">
                    <option value="asc" selected>
                        昇順
                    </option>
                    <option value="desc">
                        降順
                    </option>
                </select>
            </div>
            <div class="field">
                <label>
                </label>
                <button class="btn btn-secondary" id="reservation-search-clear" type="button">
                    条件をクリア
                </button>
            </div>
        </div>
        <p aria-live="polite" class="muted" id="reservation-result-count">
        </p>
        <div class="table-wrap">
            <table id="reservation-table">
                <thead>
                    <tr>
                        <th> 予約日</th>
                        <th>便</th>
                        <th>船名</th>
                        <th> 人数</th>
                        <th>状況</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr data-search-row>
                        <td>2026/08/02</td>
                        <td>半夜便</td>
                        <td>3名</td>
                    </tr>
                    <tr data-search-row>
                        <td>2026/08/02</td>
                        <td>深夜便</td>
                        <td>3名</td>
                    </tr>
                    <tr data-search-row>
                        <td>2026/08/01</td>
                        <td>半夜便</td>
                        <td>1名</td>
                    </tr>
                    <tr data-search-row>
                        <td>2026/08/01</td>
                        <td>深夜便</td>
                        <td>2名</td>
                    </tr>
                    <tr data-search-row>
                        <td>2026/07/31</td>
                        <td>半夜便</td>
                        <td>5名</td>
                    </tr>
                    <tr data-search-row>
                        <td>2026/07/31</td>
                        <td>深夜便</td>
                        <td>4名</td>
                    </tr>
                    <tr data-search-row>
                        <td>2026/07/30</td>
                        <td>半夜便</td>
                        <td>2名</td>
                    </tr>
                    <tr data-search-row>
                        <td>2026/07/30</td>
                        <td>深夜便</td>
                        <td>2名</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer class="footer">
        @ 豊漁丸 予約システム
    </footer>
    <script src="../shared/appData.js"></script>
    <script src="js/sharedDataBinder.js"></script>
    <script src="js/adminMockData.js"></script>
    <script src="js/admin.js">
    </script>
</body>
</html>
