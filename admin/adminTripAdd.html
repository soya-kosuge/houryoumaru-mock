<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   新規出船登録｜豊漁丸 管理画面
  </title>
  <link href="css/admin.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="site-header">
   <div class="header-inner">
    <a class="brand" href="adminDashboard.html">
     <img alt="豊漁丸" class="brand-logo" src="images/豊漁丸_管理者ページ_ロゴ.png"/>
    </a>
    <nav class="header-nav">
     <a href="adminDashboard.html">
      ダッシュボード
     </a>
     <a href="adminReservation.html">
      予約管理
     </a>
     <a class="is-active" href="adminTrip.html">
      出船管理
     </a>
     <a href="adminCustomer.html">
      顧客管理
     </a>
     <a href="adminNotice.html">
      お知らせ
     </a>
     <a href="adminSettings.html">
      システム設定
     </a>
    </nav>
    <button aria-label="メニューを開く" class="menu-toggle" type="button">
     メニュー
    </button>
   </div>
  </header>
  <section class="hero trip-add-hero">
   <div class="hero-inner">
    <p class="eyebrow">
     HORYOMARU ADMIN
    </p>
    <div class="trip-add-hero-row">
     <div>
      <h1>
       新規出船登録
      </h1>
      <p>
       新しい出船予定を登録します。運航に必要な情報を入力してください。
      </p>
     </div>
     <a class="btn btn-secondary trip-add-back" href="adminTrip.html">
      ← 出船一覧へ戻る
     </a>
    </div>
   </div>
  </section>
  <main class="page trip-add-page">
   <form class="trip-add-form" data-demo-submit="出船予定を登録しました" data-redirect="adminTrip.html">
    <section class="trip-form-section">
     <div class="trip-form-heading">
      <div class="trip-form-icon">
       1
      </div>
      <div>
       <h2>
        基本情報
       </h2>
       <p>
        出船日と便、使用する船を設定します。
       </p>
      </div>
     </div>
     <div class="trip-form-body form-grid">
      <div class="field">
       <label for="trip-date">
        出船日付
        <span class="required-label">
         必須
        </span>
       </label>
       <input class="input" id="trip-date" required="" type="date"/>
      </div>
      <div class="field">
       <label for="trip-name">
        便名
        <span class="required-label">
         必須
        </span>
       </label>
       <select class="select" id="trip-name" required="">
        <option value="">
         選択してください
        </option>
        <option>
         半夜便
        </option>
        <option>
         午前便
        </option>
        <option>
         午後便
        </option>
       </select>
      </div>
      <div class="field">
       <label for="ship-name">
        船名
       </label>
       <input class="input" id="ship-name" placeholder="例：豊漁丸"/>
      </div>
      <div class="field">
       <label for="captain-name">
        船長名
       </label>
       <input class="input" id="captain-name" placeholder="例：後藤船長"/>
      </div>
     </div>
    </section>
    <section class="trip-form-section">
     <div class="trip-form-heading">
      <div class="trip-form-icon">
       2
      </div>
      <div>
       <h2>
        運航情報
       </h2>
       <p>
        集合・出船時刻と釣り物を設定します。
       </p>
      </div>
     </div>
     <div class="trip-form-body form-grid">
      <div class="field">
       <label for="meeting-time">
        集合時刻
       </label>
       <input class="input" id="meeting-time" type="time"/>
      </div>
      <div class="field">
       <label for="trip-time">
        出船時刻
        <span class="required-label">
         必須
        </span>
       </label>
       <input class="input" id="trip-time" required="" type="time"/>
      </div>
      <div class="field full">
       <label for="meeting-place">
        集合場所
       </label>
       <input class="input" id="meeting-place" placeholder="例：豊漁丸乗船場"/>
      </div>
      <div class="field full">
       <label for="fishing-target">
        釣り物
       </label>
       <input class="input" id="fishing-target" placeholder="例：マイカ"/>
      </div>
     </div>
    </section>
    <section class="trip-form-section">
     <div class="trip-form-heading">
      <div class="trip-form-icon">
       3
      </div>
      <div>
       <h2>
        予約・料金設定
       </h2>
       <p>
        受付状態、定員、料金を設定します。
       </p>
      </div>
     </div>
     <div class="trip-form-body form-grid trip-setting-grid">
      <div class="field">
       <label for="capacity">
        定員
       </label>
       <div class="input-with-unit">
        <input class="input" id="capacity" min="1" placeholder="16" type="number"/>
        <span>
         名
        </span>
       </div>
      </div>
      <div class="field">
       <label for="price">
        料金
       </label>
       <div class="input-with-unit">
        <input class="input" id="price" min="0" placeholder="12000" type="number"/>
        <span>
         円
        </span>
       </div>
      </div>
      <div class="field full">
       <label for="trip-status">
        受付状態
       </label>
       <select class="select" id="trip-status">
        <option>
         受付中
        </option>
        <option>
         満席
        </option>
        <option>
         受付停止
        </option>
       </select>
       <p class="field-help">
        登録後も出船管理画面から変更できます。
       </p>
      </div>
     </div>
    </section>
    <div class="trip-form-footer">
     <div class="trip-form-footer-note">
      入力内容を確認してから登録してください。
     </div>
     <div class="trip-form-actions">
      <a class="btn btn-secondary" href="adminTrip.html">
       キャンセル
      </a>
      <button class="btn btn-primary trip-submit-btn" type="submit">
       出船予定を登録する
      </button>
     </div>
    </div>
   </form>
  </main>
  <footer class="footer">
   © 豊漁丸 管理画面 MOCK
  </footer>
  <script src="js/admin.js">
  </script>
 </body>
</html>
