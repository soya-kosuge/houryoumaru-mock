<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   新規出船登録｜豊漁丸 管理画面
  </title>
  <link href="css/admin.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="site-header">
   <div class="header-inner">
    <a class="brand" href="adminDashboard.html">
     <img alt="豊漁丸" class="brand-logo" src="images/豊漁丸_管理者ページ_ロゴ.png"/>
    </a>
    <nav class="header-nav">
     <a class="is-active" href="adminDashboard.html">
      ダッシュボード
     </a>
     <a href="adminReservation.html">
      予約管理
     </a>
     <a href="adminTrip.html">
      出船管理
     </a>
     <a href="adminCustomer.html">
      顧客管理
     </a>
     <a href="adminNotice.html">
      お知らせ
     </a>
     <a href="adminSettings.html">
      システム設定
     </a>
    </nav>
    <button aria-label="メニューを開く" class="menu-toggle" type="button">
     メニュー
    </button>
   </div>
  </header>
  <section class="hero">
   <div class="hero-inner">
    <p class="eyebrow">
     HORYOMARU ADMIN
    </p>
    <h1>
     新規出船登録
    </h1>
    <p>
     出船日、便、船長、料金などの基本情報を登録します。
    </p>
   </div>
  </section>
  <main class="page">
   <section class="card">
    <div class="card-body">
     <form data-demo-submit="出船予定を登録しました" data-redirect="adminTrip.html">
      <div class="form-grid">
       <div class="field">
        <label for="trip-date">
         出船日付
        </label>
        <input class="input" id="trip-date" required="" type="date"/>
       </div>
       <div class="field">
        <label for="trip-time">
         出船時刻
        </label>
        <input class="input" id="trip-time" required="" type="time"/>
       </div>
       <div class="field">
        <label for="trip-name">
         便名
        </label>
        <select class="select" id="trip-name" required="">
         <option value="">
          選択してください
         </option>
         <option>
          半夜便
         </option>
         <option>
          午前便
         </option>
         <option>
          午後便
         </option>
        </select>
       </div>
       <div class="field">
        <label for="ship-name">
         船名
        </label>
        <input class="input" id="ship-name" placeholder="例：豊漁丸"/>
       </div>
       <div class="field">
        <label for="captain-name">
         船長名
        </label>
        <input class="input" id="captain-name" placeholder="例：後藤船長"/>
       </div>
       <div class="field">
        <label for="fishing-target">
         釣り物
        </label>
        <input class="input" id="fishing-target" placeholder="例：マイカ"/>
       </div>
       <div class="field">
        <label for="meeting-time">
         集合時刻
        </label>
        <input class="input" id="meeting-time" type="time"/>
       </div>
       <div class="field">
        <label for="capacity">
         定員
        </label>
        <input class="input" id="capacity" min="1" placeholder="例：16" type="number"/>
       </div>
       <div class="field full">
        <label for="meeting-place">
         集合場所
        </label>
        <input class="input" id="meeting-place" placeholder="例：豊漁丸乗船場"/>
       </div>
       <div class="field">
        <label for="price">
         料金
        </label>
        <input class="input" id="price" min="0" placeholder="例：12000" type="number"/>
       </div>
       <div class="field">
        <label for="trip-status">
         受付状態
        </label>
        <select class="select" id="trip-status">
         <option>
          受付中
         </option>
         <option>
          満席
         </option>
         <option>
          受付停止
         </option>
        </select>
       </div>
      </div>
      <div class="form-actions">
       <button class="btn btn-primary" type="submit">
        登録する
       </button>
       <a class="btn btn-secondary" href="adminTrip.html">
        戻る
       </a>
      </div>
     </form>
    </div>
   </section>
  </main>
  <footer class="footer">
   © 豊漁丸 管理画面 MOCK
  </footer>
  <script src="js/admin.js">
  </script>
 </body>
</html>
