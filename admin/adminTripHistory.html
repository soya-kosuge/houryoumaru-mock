<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>過去の出船履歴｜豊漁丸 管理画面</title>
    <link href="css/admin.css" rel="stylesheet" />
    <link href="css/adminTripStatus.css" rel="stylesheet" />
</head>
<body data-trip-view="history">
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="adminDashboard.html"><img alt="豊漁丸" class="brand-logo" src="images/豊漁丸_管理者画面_ロゴ.png" /></a>
            <nav class="header-nav">
                <a href="adminDashboard.html">ダッシュボード</a>
                <a href="adminReservation.html">予約管理</a>
                <a class="is-active" href="adminTrip.html">出船管理</a>
                <a href="adminCustomer.html">顧客管理</a>
                <a href="adminLineDelivery.html">LINE配信</a>
            </nav>
            <button aria-label="メニューを開く" class="menu-toggle" type="button">メニュー</button>
        </div>
    </header>
    <section class="hero">
        <div class="hero-inner">
            <p class="eyebrow">HORYOMARU ADMIN</p>
            <h1>過去の出船履歴</h1>
            <p>過去の出船情報を検索・確認できます。</p>
        </div>
    </section>
    <main class="page">
        <div class="page-actions">
            <h2 class="section-title">出船履歴一覧</h2>
            <div class="actions"><a class="btn btn-secondary" href="adminTrip.html">出船予定一覧へ戻る</a></div>
        </div>
        <div class="toolbar">
            <div class="field"><label for="trip-date">出船日</label><input class="input" id="trip-date" type="date" /></div>
            <div class="field"><label for="trip-course">便</label><select class="input" id="trip-course"><option value="">すべて</option><option value="早朝便">早朝便</option><option value="アオリ便">アオリ便</option><option value="半夜便">半夜便</option><option value="深夜便">深夜便</option></select></div>
            <div class="field"><label for="trip-ship">船名</label><select class="input" id="trip-ship"><option value="">すべて</option><option value="カムトゥドリーム">カムトゥドリーム</option><option value="ドリーム">ドリーム</option><option value="スーパードリーム">スーパードリーム</option></select></div>
            <div class="field"><label for="trip-captain">船長</label><select class="input" id="trip-captain"><option value="">すべて</option><option value="佐藤船長">佐藤船長</option><option value="山田船長">山田船長</option></select></div>
            <div class="field"><label for="trip-status">状態</label><select class="input" id="trip-status"><option value="">すべて</option><option value="空きあり">空きあり</option><option value="残りわずか">残りわずか</option><option value="満員">満員</option></select></div>
            <div class="field"><label></label><button class="btn btn-secondary" id="trip-search-clear" type="button">条件をクリア</button></div>
        </div>
        <p aria-live="polite" class="muted" id="trip-result-count"></p>
        <div class="table-wrap trip-table-wrap">
            <table id="trip-table">
                <thead><tr><th>出船日</th><th>便</th><th>船名</th><th>船長</th><th>釣り物</th><th>予約</th><th>特別枠</th><th>状態</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <footer class="footer">@ 豊漁丸 予約システム</footer>
    <script src="../shared/appData.js"></script>
    <script src="js/sharedDataBinder.js"></script>
    <script src="js/adminMockData.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
